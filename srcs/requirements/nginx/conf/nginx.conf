server 
{
    # 1. Escuchar solo en el 443 con TLS
    listen 443 ssl;
    server_name pmendez-.42.fr;

    # 2. Certificado creado en el Dockerfile y protocolos permitidos
    ssl_certificate     /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 3. Carpeta de la web: es el volumen compartido con WordPress
    root  /var/www/html;
    index index.php index.html;

    # 4. Para cada URL, nginx prueba en orden:
    #    ¿es un archivo? -> lo devuelve | ¿es una carpeta? -> su index | si no -> index.php
    #    (así funcionan las URLs "bonitas" de WordPress, como /hola-mundo/)
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # 5. Las URLs que terminan en .php no las ejecuta nginx: se las envía a PHP-FPM
    #    "wordpress" es el nombre del contenedor dentro de la red de Docker
    location ~ \.php$ {
        include       fastcgi_params;   # datos estándar de la petición (método, URL...)
        fastcgi_pass  wordpress:9000;
        # Le decimos a PHP-FPM qué archivo ejecutar, p. ej. /var/www/html/index.php
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
